name: Release

# Publish a release in either of two ways:
#   - push a tag such as v0.1.0, or
#   - Actions → Release → "Run workflow" and enter the version (e.g. v0.1.0);
#     the tag is then created on the commit the workflow runs from.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to release, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: read

env:
  # Build with the latest patch of a supported Go release (go.mod states the
  # minimum version needed to compile from source).
  GO_VERSION: "1.26.x"
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - name: Check the version tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Version must look like v1.2.3 (got '$TAG')"; exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - run: go test -race -count=1 ./...

  release:
    name: Publish GitHub release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: Build release artifacts
        run: go run ./tools/release -version "$TAG" -out dist
      - name: Add installers
        run: cp install.sh install.ps1 dist/
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            where=(--verify-tag)
          else
            where=(--target "$GITHUB_SHA") # creates the tag on this commit
          fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "LocalDNS $TAG" \
            --generate-notes \
            "${where[@]}"

  # After publishing, install from the real public URL on every platform.
  verify:
    name: Verify install (${{ matrix.os }})
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    env:
      LOCALDNS_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - name: curl | sh (latest release URL, as on the website)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.sh" | sh
          localdns version | grep -F "${TAG#v}"
          bash scripts/smoke-test.sh
      - name: irm | iex (latest release URL, as on the website)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          irm "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/install.ps1" | iex
          if (-not ((localdns version) -match [regex]::Escape($env:TAG.TrimStart('v')))) { throw 'unexpected version' }
          & ./scripts/smoke-test.ps1
