name: Deploy website

# Publishes docs/ (the landing page) to GitHub Pages, plus the terminal guide
# at /guide/. The guide is the same file the dashboard serves at /guide, so
# it is copied from internal/ui/static rather than kept twice.
# Repository setting required once: Settings → Pages → Source: "GitHub Actions".

on:
  push:
    paths:
      - "docs/**"
      - "internal/ui/static/guide.*"
      - "internal/ui/static/style.css"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment that is already running; queue the next one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    # Only the default branch publishes the site.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Build the site
        run: |
          test -f docs/index.html
          for f in assets/site.css assets/site.js assets/img/logo.svg assets/img/og.png \
            assets/video/locly-en.mp4 assets/video/locly-ar.mp4 assets/video/locly-en.jpg assets/video/locly-ar.jpg \
            assets/video/locly-en.vtt assets/video/locly-ar.vtt; do
            test -f "docs/$f" || { echo "missing docs/$f"; exit 1; }
          done
          mkdir -p _site
          cp -R docs/. _site/
          mkdir -p _site/guide/assets
          cp internal/ui/static/guide.html _site/guide/index.html
          cp internal/ui/static/style.css internal/ui/static/guide.css internal/ui/static/guide.js \
            internal/ui/static/favicon.svg _site/guide/assets/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
